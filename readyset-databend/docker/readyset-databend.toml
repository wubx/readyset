# readyset-databend: one shared native runtime with real source schemas.
# The Databend password is read ONLY from the DATABEND_PASSWORD environment variable.

# Stable identity of this instance. Empty: generated once and kept in [storage].dir.
instance_id = ""

# Explicit consent to create this instance's Stream (readyset_<instance_id>_<table>) in the
# table's database. That Stream is the only object readyset-databend creates in Databend.
confirm_create = true

[upstream]
url  = "http://databend:8000"
user = "readyset"

[listen]
http = "0.0.0.0:8001"

[replication]
# Every source must pre-exist. DESCRIBE supplies real columns/types; no implicit primary key.
# One Stream/source/instance, one native server and shared process budget for ALL tables.
# Example with two sources: ["sales.orders", "crm.customers"]. JOINs still go upstream.
tables        = ["sales.orders"]
poll_interval = "1s"
max_staleness = "10s"
# A failed table recovers itself after this delay (doubling up to 5 minutes); other
# tables are never paused. Range 1s..300s.
retry_backoff = "5s"

[storage]
dir = "/var/lib/readyset-databend"

[cache]
# Opt in to native partial materialization: only requested keys occupy reader memory.
# The disk base table still contains every row. Full materialization remains the default.
partial = false
# Enable partial=true before setting a soft allocated-memory target (NOT an RSS hard cap).
# memory_limit_mb = 2048
# Cold replay wait; timeout forwards only this query. 0 warms asynchronously and falls through.
upquery_timeout_ms = 5000
