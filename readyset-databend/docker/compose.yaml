# Example: readyset-databend in front of an existing Databend.
#
#   DATABEND_PASSWORD=... docker compose -f readyset-databend/docker/compose.yaml up -d
#
# Applications then use http://<host>:8001 instead of the Databend address.
services:
  readyset-databend:
    image: readyset-databend:dev
    # Restarts are cheap (persisted state resumes in seconds); the process also exits on
    # purpose when the native runtime fails closed, so always bring it back.
    restart: unless-stopped
    # SIGTERM lets an in-flight table batch finish and commit (up to 60s) before shutdown;
    # a shorter grace period SIGKILLs it and that table is rebuilt on start.
    stop_grace_period: 120s
    environment:
      DATABEND_PASSWORD: ${DATABEND_PASSWORD:?set DATABEND_PASSWORD}
      RUST_LOG: warn
    ports:
      - "8001:8001"
    volumes:
      - ./readyset-databend.toml:/etc/readyset-databend/readyset-databend.toml:ro
      - readyset-databend-data:/var/lib/readyset-databend

volumes:
  readyset-databend-data:
